# Job Sentinel settings.
#
# Role "profiles" make this system evolvable: to hunt data-engineer roles later,
# add a new profile block and flip `active_profile` (or run both — see main.py).

active_profile: cybersecurity

profiles:
  cybersecurity:
    # Candidate targets EARLY-CAREER roles: 0-2 years.
    max_experience_years: 2

    # Roles that clear every other gate but ask for up to (cap + this) years go
    # out as a separate, clearly-labelled "stretch" digest instead of being
    # dropped. At a 2-yr cap the strict match list is empty for days at a time,
    # and "needs 3 years" is a number plenty of people get hired past.
    stretch_years: 3

    # Titles that disqualify outright. At a 0-2 yr target these matter more than
    # the experience parser: senior postings very often state no year count at
    # all, so the number-based gate lets them through and only the title betrays
    # them. Word-boundary matched — "lead" never fires inside "leadership".
    exclude_titles:
      - senior
      - sr
      - staff
      - principal
      - lead
      - manager
      - director
      - head
      - vp
      - vice president
      - architect          # architect roles are 8+ yrs in practice
      - distinguished
      - fellow
      - chief
      - ciso
      - expert
      - iii
      - iv

    # Company tiers come from the source list's profile_fit and are set by
    # scripts/discover_ats.py. Boost ranks the alert, it never filters.
    priority_boost:
      high: 6
      medium: 2
      low: 0
      unknown: 0

    keywords:
      # product-specific (word-boundary matched — safe for short tokens)
      - ZIA
      - ZPA
      - Zscaler
      - Avalor
      - UVM
      - EDR
      - XDR
      - SASE
      - SSE
      - ZTNA
      - CASB
      - DLP
      # domain
      - cyber security
      - cybersecurity
      - network security
      - security engineer
      - security analyst
      - security operations
      - information security
      - infosec
      - application security
      - cloud security
      - product security
      - zero trust
      - SIEM
      - SOC analyst
      - threat detection
      - threat intelligence
      - threat hunting
      - threat hunter
      - incident response
      - vulnerability management
      - penetration testing
      - DevSecOps
      # observed missing while auditing live Palo Alto / Zscaler boards —
      # real security titles that matched none of the keywords above
      - firewall
      - identity security
      - IAM
      - SOC
      - security operations center
      - malware
      - forensics
      - red team
      - blue team
      - PSIRT
      - security compliance
      # early-career security titles. Deliberately NOT bare "trainee" /
      # "fresher" / "graduate engineer": keywords are OR-matched, so a generic
      # term would admit "Graduate Engineer Trainee - Mechanical" and every
      # other non-security opening. Seniority is handled by exclude_titles and
      # max_experience_years, not by loosening the domain filter.
      - security associate
      - associate security
      - security intern
      - security trainee

  # Ready for the future — flip active_profile to use.
  data_engineering:
    max_experience_years: 2
    exclude_titles: [senior, sr, staff, principal, lead, manager, director, head, vp, architect]
    keywords:
      - data engineer
      - ETL
      - data pipeline
      - Spark
      - Airflow
      - dbt
      - Kafka
      - data warehouse
      - Snowflake
      - BigQuery

  software_engineering:
    max_experience_years: 2
    exclude_titles: [senior, sr, staff, principal, lead, manager, director, head, vp, architect]
    keywords:
      - software engineer
      - backend engineer
      - full stack
      - distributed systems
      - SDE

# Location policy is code-level (India onsite OR remote-open-to-India) — see src/matcher.py.
report:
  max_jobs_per_run: 60   # safety valve: never spam more than this in one notification burst

# With a large company list a single run can exceed the Actions timeout. Sharding
# splits the roster across consecutive runs: run N scans shard (N mod shards).
# `shards: 1` disables it entirely and every run scans everything.
scan:
  # MEASURED, not guessed: a full sweep of all 250 boards takes ~7 min wall at
  # 12 workers, timed end-to-end from a home connection — slower than a GitHub
  # runner, so treat it as an upper bound against the 45-min job timeout.
  #
  # Sharding is therefore switched OFF. It costs alert latency (a 4-shard
  # rotation means a new posting can sit unseen for ~24h) and buys headroom we
  # measurably do not need. Applying early is worth real money in a job hunt.
  #
  # Raise this to 2 or 4 if the roster grows several-fold or runs start
  # approaching the timeout — the rotation is correct and tested either way.
  shards: 1
  max_workers: 12
